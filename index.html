<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bistué Boarding">
<meta name="theme-color" content="#0e5f7a">
<meta name="description" content="Where to kite today: the Gorge or the Oregon coast, scored and ranked by drive time.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}html,body{margin:0}</style>
<title>Bistué Boarding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one ranked list, scanned like a lift-line board. Big score left, drive time right, detail folds open under the row. */
:root{
  --bg:#edf0f2; --surface:#ffffff; --surface2:#f5f7f8; --fg:#162029; --muted:#5d6c78; --line:#d3dbe1; --accent:#0e5f7a; --accent-fg:#ffffff;
  --good:#1e7f49; --ok:#b8800a; --poor:#b23f2c; --gate:#7c8792;
  --good-bg:#dff3e6; --ok-bg:#fbefd0; --poor-bg:#f8dcd6; --gate-bg:#e6eaee;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17222b; --surface2:#1e2b35; --fg:#e8eef2; --muted:#93a3b0; --line:#2b3a46; --accent:#5fc3e6; --accent-fg:#0b1218;
  --good:#5fd38a; --ok:#f0bd4e; --poor:#f08670; --gate:#8a97a3;
  --good-bg:#153726; --ok-bg:#3b2f10; --poor-bg:#3f1f19; --gate-bg:#243039; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17222b; --surface2:#1e2b35; --fg:#e8eef2; --muted:#93a3b0; --line:#2b3a46; --accent:#5fc3e6; --accent-fg:#0b1218;
  --good:#5fd38a; --ok:#f0bd4e; --poor:#f08670; --gate:#8a97a3;
  --good-bg:#153726; --ok-bg:#3b2f10; --poor-bg:#3f1f19; --gate-bg:#243039; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;margin:0;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
header.top h1{font-size:30px;line-height:1;letter-spacing:-.01em;font-weight:700}
header.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.refresh{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}.refresh span{font-size:12px;color:var(--muted)}
.btn.small{padding:4px 10px;font-size:13px}.btn:disabled{opacity:.6;cursor:default}
.hold{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}.hold.warn{border-color:var(--ok);background:var(--ok-bg)}
.link{all:unset;color:var(--accent);cursor:pointer;font-weight:600}.kv span small{display:block;font:500 11px var(--body);color:var(--muted)}
.narr{font-size:15px;line-height:1.35;margin:2px 0 10px;color:var(--fg)}.narr b{font-family:var(--display);font-weight:600}
.notif{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.12);margin:8px 0;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.notif .ic{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font:700 14px var(--display)}.notif .t{font:600 13px var(--body)}.notif .b{font-size:13px;color:var(--fg)}.notif .when{font-size:11px;color:var(--muted);float:right}
.widget{width:170px;height:170px;border-radius:22px;background:linear-gradient(160deg,var(--accent),#0a3d50);color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 18px rgba(0,0,0,.2)}.widget .w1{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}.widget .w2{font:700 40px var(--display);line-height:1}.widget .w3{font:600 16px var(--display);line-height:1.1}.widget .w4{font:500 12px var(--body);opacity:.85}
.strip7{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 12px}.strip7 div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;min-width:0}.strip7 small{display:block;font:600 10px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}.strip7 b{display:block;font:700 18px var(--display);line-height:1.1}.strip7 span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticks{display:flex;justify-content:space-between;font:500 10px var(--body);color:var(--muted);margin:-2px 2px 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.dayspick{display:flex;gap:4px}.dayspick button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:600 12px var(--body);padding:6px 0;border-radius:6px;cursor:pointer}.dayspick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;font-family:var(--display);font-size:15px;font-weight:600;line-height:1.1;text-align:left;min-width:84px}
.days button small{display:block;font:500 11px var(--body);color:var(--muted);margin-top:2px}
.days button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:4px 0 14px;display:flex;align-items:stretch;overflow:hidden}
.hero .hpic{flex:0 0 132px;position:relative;background:var(--surface2)}.hero .hpic img{width:100%;height:100%;object-fit:cover;display:block;min-height:96px}
.hero .hbody{display:flex;gap:14px;align-items:center;padding:12px 14px;min-width:0;flex:1}
@media (max-width:480px){.hero .hpic{flex-basis:104px}}
.hero .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.hero .lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero .name{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15}
.hero .meta{color:var(--muted);font-size:14px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.radius{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.radius label{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.radius input{flex:1;min-width:0;accent-color:var(--accent)}
.radius output{font:500 13px var(--mono);min-width:5ch;text-align:right}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row>button.head{all:unset;display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:stretch;width:100%;min-height:76px;padding:0 12px 0 0;cursor:pointer;box-sizing:border-box}
.row>button.head>.body{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:10px 0}   /* the chip row keeps clearance from the tile's bottom edge however the name or conditions wrap */
.row>button.head>.drive{align-self:center}
.pic{position:relative;width:112px;min-height:76px;overflow:hidden;background:var(--surface2)}   /* stretches to the tile's height */
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic.nophoto,.hpic.nophoto{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--surface2),var(--line))}
.pic.nophoto svg,.hpic.nophoto svg{width:40%;height:40%;color:var(--muted);opacity:.7}
.pic.nophoto .score{left:6px;bottom:6px}
.pic .score{position:absolute;left:6px;bottom:6px;height:auto;padding:3px 7px;font-size:17px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.row>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.score{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.score.good{background:var(--good-bg);color:var(--good)}.score.ok{background:var(--ok-bg);color:var(--ok)}.score.poor{background:var(--poor-bg);color:var(--poor)}.score.gate{background:var(--gate-bg);color:var(--gate)}
.row .name{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.1}
.row .name span{font:500 12px var(--body);color:var(--muted);margin-left:6px}
.row .wind{font:500 13px var(--mono);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font:600 11px var(--body);letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chip.poor{background:var(--poor-bg);color:var(--poor);border-color:transparent}.chip.gate{background:var(--gate-bg);color:var(--gate);border-color:transparent}
.drive{text-align:right;font-family:var(--display);font-size:18px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.drive small{display:block;font:500 11px var(--body);color:var(--muted);margin-top:3px}
.detail{border-top:1px solid var(--line);padding:12px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.detail p{margin:0;font-size:14px}
.detail .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kv span{font:500 14px var(--mono)}
.kv div.stale{opacity:.55}.kv div.stale span{color:var(--muted)}
.strip{width:100%;height:auto;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:8px;font:600 14px var(--body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted)}
.beyond{margin-top:14px;color:var(--muted);font-size:14px}
.beyond button{all:unset;color:var(--accent);cursor:pointer;font-weight:600}
.addspot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.away{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;line-height:1.35}
.away .lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.away .actions{margin-top:8px}
.row.pending .head{cursor:default;opacity:.8}.row.pending .wind{color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;justify-content:center;z-index:5}
.sheet{position:fixed;inset:0;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--surface);color:var(--fg);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:22px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{all:unset;cursor:pointer;color:var(--muted);font:600 14px var(--body)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.check li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:0 0 auto}
.check li.why small{display:block;color:var(--muted)}
.check li.add{gap:8px}.check li.add input{flex:1;min-width:0;font:500 15px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg)}
.check .rm{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;background:var(--poor-bg);color:var(--poor);font:700 16px var(--body);text-align:center;flex:0 0 auto}
.check h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-family:var(--body);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input[type=number]{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);width:120px}
.kites{display:flex;gap:6px;flex-wrap:wrap}
.kites button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:600 14px var(--mono);padding:6px 10px;border-radius:8px;cursor:pointer}
.kites button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.how p{font-size:14px;margin:0 0 8px}
.how ol{padding-left:18px;margin:0 0 8px;font-size:14px}
@media (max-width:480px){.row>button.head{grid-template-columns:96px 1fr auto;gap:8px;min-height:72px}.pic{width:96px;min-height:72px}.pic .score{font-size:15px}.row .name{font-size:16px}.drive{font-size:16px}.hero .big{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.detail{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Bistué Boarding</h1>
      <div class="sub" id="sub">Loading forecast…</div>
      <div class="refresh"><button class="btn small" id="refreshBtn" hidden>Refresh now</button><span id="refreshNote" hidden></span></div>
    </div>
    <div class="seg" role="group" aria-label="Home base">
      <button id="homeLO" aria-pressed="true">Lake Oswego</button>
      <button id="homeBC" aria-pressed="false">Pacific City</button>
      <button id="homeX" aria-pressed="false">Elsewhere</button>
    </div>
  </header>

  <nav class="days" id="days" aria-label="Day"></nav>

  <div class="narr" id="narr"></div>
  <div id="hero"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Riding style">
      <button data-style="freeride" aria-pressed="true">Freeride</button>
      <button data-style="wave" aria-pressed="false">Wave</button>
      <button data-style="foil" aria-pressed="false">Foil</button>
    </div>
    <div class="seg" role="group" aria-label="Sort">
      <button data-sort="score" aria-pressed="true">Today</button>
      <button data-sort="tomorrow" aria-pressed="false">Tomorrow</button>
      <button data-sort="distance" aria-pressed="false">Distance</button>
    </div>
    <div class="radius">
      <label for="radius">Drive</label>
      <input type="range" id="radius" min="30" max="360" step="15" value="90">
      <output id="radiusOut" for="radius">1h30</output>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="beyond" id="beyond"></div>
  <div class="addspot"><button class="btn" id="openKeep">Look up a new spot</button><button class="btn" id="openHere">This spot is killer</button></div>
</div>

<div class="dock">
  <button class="btn" id="openCheck">Checklist</button>
  <button class="btn" id="openSettings">Rider</button>
  <button class="btn" id="openAlerts">Alerts</button>
  <button class="btn" id="openHow">How it scores</button>
</div>

<div id="sheetHost"></div>
<input type="file" id="photoFile" accept="image/*" hidden>

function inSectors(d, secs){ return secs.some(([a,b])=> a<=b ? (d>=a && d<=b) : (d>=a || d<=b)); }

function speedScore(s, st){
  if(s==null) return {v:0};

  if(s<=peak) return {v:0.6+0.4*(s-lo)/(peak-lo)};
  if(s<=hi) return {v:1-0.3*(s-peak)/(hi-peak)};
  if(s<hi+6) return {v:0.7*(1-(s-hi)/6),why:"Strong"};

}
function gustScore(s,g){

const COMPASS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];

/* ---------- narrative + alerts ---------- */
function bestPerDay(homeKey, maxDrive, style){
  // {day: {spot, r, drive}} best spot within maxDrive from the given home for each day
  const saveHome=settings.home; settings.home=homeKey;
  const out={};
  for(const d of dayKeys){
    let best=null;
    for(const spot of allSpots()){ const f=forecasts[spot.id]; if(!f) continue; const drive=driveMins(spot); if(drive==null||drive>maxDrive) continue;
      const r=dayScore(spot,f,d,style); if(!r) continue; if(!best||r.score>best.r.score||(r.score===best.r.score&&drive<best.drive)) best={spot,r,drive}; }
    out[d]=best;
  }
  settings.home=saveHome; return out;
}
function narrative(){
  const bp=bestPerDay(settings.home, Math.max(settings.radius,180), settings.style);
  const good=[], ok=[];
  for(const d of dayKeys){ const b=bp[d]; if(!b) continue; const lbl=dayLabel(d)[0]; if(b.r.score>=6) good.push({d,lbl,b}); else if(b.r.score>=4) ok.push({d,lbl,b}); }
  const reg=b=> b.spot.region==="Gorge"?"the Gorge":"the coast";
  if(!good.length&&!ok.length){
    const why=mode(dayKeys.map(d=>bp[d]&&bp[d].r.reason).filter(Boolean));
    return `<b>Quiet stretch.</b> Nothing within ${mins(Math.max(settings.radius,180))} scores above 4 through ${dayLabel(dayKeys[dayKeys.length-1])[0]}${why?` — mostly "${why.toLowerCase()}"`:""}.`;
  }
  const parts=[];
  if(good.length){ const g=good[0]; parts.push(`<b>${g.lbl} is the day:</b> ${esc(g.b.spot.name)} on ${reg(g.b)} at ${g.b.r.score.toFixed(1)} (${Math.round(g.b.r.spd)}g${Math.round(g.b.r.gst)} ${compass(g.b.r.dir)}, ${hhmm(g.b.r.from)}–${hhmm(g.b.r.to)}, ${mins(g.b.drive)})`);
    if(good.length>1) parts.push(`${good.slice(1).map(x=>`${x.lbl} ${esc(x.b.spot.name)} ${x.b.r.score.toFixed(1)}`).join(", ")} also work`); }
  if(ok.length) parts.push(`${ok.map(x=>x.lbl).join(" and ")} ${ok.length>1?"are":"is"} marginal`);
  const dead=dayKeys.filter(d=>!bp[d]||bp[d].r.score<4).map(d=>dayLabel(d)[0]);
  if(dead.length&&dead.length<dayKeys.length) parts.push(dead.length>2? "everything else looks dead" : `${dead.join(" and ")} ${dead.length>1?"look":"looks"} dead`);
  return parts.join("; ")+".";
}
function alertDigest(){
  // Simulate what the alert job would send right now under the rider's parameters.
  const A=settings.alerts, out=[];
  for(const hk of ["LO","BC"]){
    const bp=bestPerDay(hk, A.maxDrive, settings.style);
    const saveHome=settings.home; settings.home=hk;
    const hits=[];
    dayKeys.slice(0, A.lead+1).forEach((d,di)=>{
      if(di===0 && !A.sameDay) return;
      const dow=new Date(d+"T12:00:00").getDay(); if(!A.days.includes(dow)) return;
      const rows=allSpots().map(spot=>{ const f=forecasts[spot.id]; if(!f) return null; const drive=driveMins(spot); if(drive==null||drive>A.maxDrive) return null; const r=dayScore(spot,f,d,settings.style); return r?{spot,r,drive}:null; })

}
function digestText(dg){

/* ---------- render ---------- */
function computeAll(){

  const rows=allSpots().map(spot=>{ const f=forecasts[spot.id]; if(!f) return null; const r=dayScore(spot,f,selDay,settings.style); if(!r) return null;
    const rt= tm&&tm!==selDay? dayScore(spot,f,tm,settings.style):null; return {spot,f,r,rt,drive:driveMins(spot)??999}; }).filter(Boolean);
  const byScore=(a,b)=> b.r.score-a.r.score || a.drive-b.drive;
  if(settings.sort==="distance") return rows.sort((a,b)=> a.drive-b.drive || b.r.score-a.r.score);
  if(settings.sort==="tomorrow") return rows.sort((a,b)=> ((b.rt?b.rt.score:b.r.score)-(a.rt?a.rt.score:a.r.score)) || a.drive-b.drive);

}

let swReg=null, pushVapid=undefined;   // pushVapid: undefined = not asked yet, false = sync service unreachable, null = it has no key, string = public key
let pendingDay=null;                    // "#day=YYYY-MM-DD" from a notification tap, applied once forecasts are in
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function standalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
async function pushSub(){ try{ if(!swReg) swReg=await navigator.serviceWorker.getRegistration(); return swReg? await swReg.pushManager.getSubscription():null; }catch(e){ return null; } }
function urlB64ToU8(b){ const s=(b+"=".repeat((4-b.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"); const r=atob(s); return Uint8Array.from(r,c=>c.charCodeAt(0)); }
function pushSection(sub){
  const h=`<h3 style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-family:var(--body)">Notifications on this phone</h3>`;
  const p=t=>`<p style="color:var(--muted);font-size:13px;margin:0 0 6px">${t}</p>`;
  const status=`<p id="pushStatus" style="color:var(--muted);font-size:13px;margin:6px 0 0"></p>`;
  if(!syncOn()) return h+p(`Alerts need sync on, so your alert settings and the list of spot-days you've already been told about follow you between devices. Turn it on under <b>Rider → Sync across devices</b>, then come back here.`)+`<div class="actions"><button class="btn" id="pushRider">Open Rider</button></div>`;
  if(!pushSupported()) return h+p(isIOS()&&!standalone()? `On an iPhone, notifications only work from the installed app: Share → <b>Add to Home Screen</b>, then open Bistué Boarding from the home screen (iOS 16.4 or newer).` : `This browser can't receive push notifications. Open the app in Safari on your iPhone or in Chrome.`);
  if(pushVapid===undefined) return h+p(`Checking the sync service…`);
  if(pushVapid===null) return h+p(`Push isn't set up on the sync service yet. One-time steps are in <b>docs/SETUP-SYNC.md</b> under "Push alerts".`);
  if(Notification.permission==="denied") return h+p(`Notifications are blocked for this app. Allow them in the phone's Settings → Notifications, then try again.`);
  if(sub) return h+p(`<b>On.</b> This phone gets one digest per hourly check when a spot within ${mins(settings.alerts.maxDrive)} of either house is forecast to score ${settings.alerts.minScore}+.`)+`<div class="actions"><button class="btn" id="pushOff">Turn off on this phone</button></div>`+status;
  return h+p(`Off. Turn on to get the digest below on this phone. Each device you link can turn it on separately; the alert rules and the "already told you" list are shared.`)+`<div class="actions"><button class="btn primary" id="pushOn">Enable notifications</button></div>`+status;
}
async function pushRender(){
  const box=document.getElementById("pushBox"); if(!box) return;
  if(syncOn() && pushSupported() && pushVapid===undefined){
    try{ const r=await syncFetch("GET",null,"/v1/push/vapid"); pushVapid= r.status===200&&r.data&&r.data.publicKey? r.data.publicKey : r.status===404? null : false; }catch(e){ pushVapid=false; }
  }
  const sub=await pushSub();
  if(!document.getElementById("pushBox")) return;
  box.innerHTML=pushSection(sub);
  const st=t=>{ const e=document.getElementById("pushStatus"); if(e) e.textContent=t; };
  const rd=document.getElementById("pushRider"); if(rd) rd.onclick=riderSheet;
  const on=document.getElementById("pushOn"); if(on) on.onclick=async()=>{
    on.disabled=true;
    try{
      // The permission prompt has to come straight from the tap (Safari), so it goes first.
      const perm=await Notification.requestPermission(); if(perm!=="granted"){ pushRender(); return; }
      if(!swReg) swReg=await navigator.serviceWorker.register("sw.js");
      await navigator.serviceWorker.ready;
      if(!pushVapid){ const r=await syncFetch("GET",null,"/v1/push/vapid"); pushVapid=r.status===200&&r.data&&r.data.publicKey? r.data.publicKey: r.status===404? null:false; if(pushVapid===null){ pushRender(); return; } if(!pushVapid) throw new Error("couldn't reach the sync service"); }
      const sub=await swReg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToU8(pushVapid)});
      const r=await syncFetch("PUT",{subscription:sub.toJSON(), ua:navigator.userAgent},"/v1/push");
      if(r.status!==200){ try{ await sub.unsubscribe(); }catch(e){} throw new Error("sync service said "+r.status); }
      pushRender();
    }catch(e){ on.disabled=false; st("Couldn't turn on notifications ("+(e&&e.message||e)+")."); }
  };
  const off=document.getElementById("pushOff"); if(off) off.onclick=async()=>{ off.disabled=true; await pushDisable(false); pushRender(); };
}
async function pushDisable(silent){
  // Unsubscribe this device and tell the Worker. Called from "Turn off" and from "Unlink this device".
  try{ const sub=await pushSub(); if(!sub) return;
    if(syncOn()) try{ await syncFetch("DELETE",{endpoint:sub.endpoint},"/v1/push"); }catch(e){}
    await sub.unsubscribe();
  }catch(e){ if(!silent) console.warn("unsubscribe failed",e); }
}

function scaleSVG(k, rows){
  // Horizontal scale with the factor's zones (for the current style) and a dot per spot at its best-window value.
  const st=STYLES[settings.style]; const W=640,H=64,pad=10; let min,max,zones,unit,val,fmt;

  else if(k==="gust"){ min=1;max=2.2;unit="× avg"; zones=[[1,1.3,"good","Clean"],[1.3,1.5,"ok","Bumpy"],[1.5,1.9,"poor","Gusty"],[1.9,2.2,"poor","Bad"]]; val=r=> r.spd>=5? Math.min(r.gst/Math.max(r.spd,1),2.2):null; fmt=v=>v.toFixed(1); }

function sectorsFromFacing(f){
  // f = compass bearing the beach faces (toward the water). Wind FROM that bearing is dead onshore.
  const n=d=>((d%360)+360)%360;
  return {best:[[n(f-30),n(f+30)]], work:[[n(f-80),n(f+80)]], off:[[n(f+130),n(f+230)]]};
}
function keepSpot({name,lat,lon,facing,waves,osm,kind,notes,photoUrl,photoCredit,photoChecked,cam,facingSrc,forecastFrom}){
  // facing may be null (a discovered spot with no shoreline nearby): then every direction "works" and nothing gates, and the detail says so.
  const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24)||"spot";
  let id="k-"+slug; while(allSpots().some(s=>s.id===id)) id="k-"+slug+"-"+Math.random().toString(36).slice(2,5);
  const est=h=>Math.round(haversineMi(h.lat,h.lon,lat,lon)*1.35/47*60/5)*5;
  const spot={id,name,region:"Kept",lat,lon,plat:lat,plon:lon,facing:facing==null?null:facing,dir:facing==null?UNKNOWN_DIR:sectorsFromFacing(facing),waves:!!waves,pass:false,photo:false,notes:notes||"",parking:"",driveLO:est(HOMES.LO),driveBC:est(HOMES.BC),kept:true,addedAt:new Date().toISOString()};
  if(osm) spot.osm=osm; if(kind) spot.kind=kind; if(facingSrc) spot.facingSrc=facingSrc; if(photoUrl){ spot.photoUrl=photoUrl; spot.photoCredit=photoCredit||""; } if(photoChecked) spot.photoChecked=photoChecked; if(cam) spot.cam=cam;
  settings.kept.push(spot); saveSettings();
  enrichKept([spot]);   // background Commons photo lookup, same scored picker as away mode; the score never waits for it
  if(forecastFrom&&forecasts[forecastFrom]){ forecasts[id]={...forecasts[forecastFrom],spotId:id}; cacheMerge({docs:Object.values(forecasts)}); }   // a discovered spot already has its forecast
  else refreshAll(false);   // pulls a forecast for the new spot; the list re-sorts once when it lands
  return spot;
}
function unkeepSpot(id){
  settings.kept=settings.kept.filter(s=>s.id!==id); delete settings.overrides[id]; delete forecasts[id];
  if(openSpot===id) openSpot=null; saveSettings(); render();
  if(riderPhotos[id]) removeRiderPhoto(id);   // his photo goes with the spot

/* ---------- away from home (SPEC §5) ---------- */
// More than AWAY_MI from both houses, the curated list is useless, so the page looks up kite spots around the
// rider in away-spots.json: OpenStreetMap's sport=kitesurfing/kiteboarding/windsurfing features worldwide plus the
// named beaches of the US, Canada and Mexico, precomputed weekly by away_spots.py (public Overpass servers are too
// slow and flaky to query from the browser). The file is fetched same-origin once, cached in localStorage with its
// date, and filtered by the drive radius. The spots get a forecast from one batched Open-Meteo call like every other
// spot and are marked "auto". Direction rules (from the shoreline, Overpass), webcams and photos enrich in the
// background with a 60 s timeout; scores never wait for them, and a spot whose shoreline lookup fails simply stays
// "auto, facing unknown". Pure functions first (away/test.mjs runs them under Node with mock data), then the page glue.
const AWAY_MI=150;                 // further than this from both houses = away mode
const AWAY_MAX_SPOTS=40;           // most spots scored per area (one batched Open-Meteo call)
const AWAY_CACHE_DAYS=7;           // last-seen results per area and the catalogue file, so reopening is instant
const AWAY_FILE="away-spots.json"; // the precomputed catalogue (same origin)
const SHORE_MI=1.6;                // a shoreline further than this from the spot doesn't tell us which way it faces
const CAM_MI=8;                    // nearest public webcam within this
const ENRICH_MS=60000;             // total budget for each background Overpass lookup (shoreline, webcams), across mirrors
const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
const UNKNOWN_DIR={best:[],work:[[0,360]],off:[]};   // facing unknown: every direction "works", nothing gates (marked in the detail)
var away={key:null, status:"idle", spots:[], at:null, radiusMi:0, note:"", generatedAt:null};   // status: idle | searching | scoring | done | empty | error
function milesFromHomes(lat,lon){ return Math.min(...Object.values(HOMES).map(h=>haversineMi(h.lat,h.lon,lat,lon))); }
function awayMode(){ const c=settings.custom||{}; return settings.home==="X" && c.lat!=null && c.lon!=null && milesFromHomes(c.lat,c.lon)>AWAY_MI; }

function searchMiles(){ return Math.min(120, Math.max(30, Math.round(settings.radius/60*47/1.35))); }   // drive minutes -> road miles -> straight-line miles
function awayKey(){ const c=settings.custom; return (+c.lat).toFixed(2)+","+(+c.lon).toFixed(2); }
function facingQuery(spots){
  // Shoreline within 2.5 km of each spot: natural=coastline for the sea, natural=water closed ways for lakes and rivers.
  const a=spots.map(s=>`(around:2500,${s.lat},${s.lon})`);
  return `[out:json][timeout:25];(${a.map(x=>`way${x}["natural"="coastline"];`).join("")}${a.map(x=>`way${x}["natural"="water"];`).join("")});out geom 300;`;
}
function camQuery(spots){
  const a=spots.map(s=>`node(around:${Math.round(CAM_MI*1609)},${s.lat},${s.lon})["man_made"="surveillance"]["surveillance:type"="webcam"];`).join("");
  return `[out:json][timeout:25];(${a});out body 200;`;
}
function osmNotes(t){
  const bits=[];
  if(t.sport) bits.push(t.sport.split(";").map(s=>s.trim()).join(", "));
  if(t.surface) bits.push(t.surface+" "+(t.natural==="beach"?"beach":"surface"));
  if(t.description) bits.push(t.description);
  if(t.access&&t.access!=="yes"&&t.access!=="public") bits.push("access: "+t.access);
  if(t.fee==="yes") bits.push("fee");
  return bits.length? "OpenStreetMap: "+bits.join(" · ") : "";
}
function pickAway(file, lat, lon, mi){

  const all=(file&&Array.isArray(file.spots)&&file.spots)||[], items=[];

    if(Math.abs(la-lat)>dLat||Math.abs(lo-lon)>dLon) continue;
    const d=haversineMi(lat,lon,la,lo); if(d>mi) continue;
    if(t.access==="private"||t.access==="no") continue;
    const sport=/kitesurf|kiteboard|windsurf/i.test(t.sport||""), kite=/kitesurf|kiteboard/i.test(t.sport||"");
    const name=e.name||t["name:en"]||(sport? (kite?"Kite launch":"Windsurf launch"):null); if(!name) continue;
    items.push({osm:String(e.id), name, lat:+la.toFixed(4), lon:+lo.toFixed(4), kind: kite?"Kite spot": sport?"Windsurf spot":"Beach", sport, notes:osmNotes(t), mi:+d.toFixed(1)});
  }
  items.sort((a,b)=> (b.sport-a.sport) || a.mi-b.mi);
  const out=[];
  for(const it of items){ if(out.some(o=>haversineMi(o.lat,o.lon,it.lat,it.lon)<0.75)) continue; out.push(it); }

}
function toAwaySpot(it){
  const est=h=>Math.round(haversineMi(h.lat,h.lon,it.lat,it.lon)*1.35/47*60/5)*5;
  return {id:"a-"+it.osm, name:it.name, region:it.kind, lat:it.lat, lon:it.lon, plat:it.lat, plon:it.lon, waves:true, pass:false, photo:false, notes:it.notes||"", parking:"",
    driveLO:est(HOMES.LO), driveBC:est(HOMES.BC), auto:true, osm:it.osm, kind:it.kind, facing:null, facingSrc:null, dir:UNKNOWN_DIR, mi:it.mi};
}
function nearestSeg(lat,lon,geom){
  // Nearest segment of a way to a point, on a local flat plane (x east, y north, in degrees of latitude). Returns {d, A, B, px, py}.
  const kx=Math.cos(lat*Math.PI/180); let best=null;
  for(let i=0;i+1<geom.length;i++){
    const A=geom[i], B=geom[i+1]; if(!A||!B) continue;
    const ax=(A.lon-lon)*kx, ay=A.lat-lat, bx=(B.lon-lon)*kx, by=B.lat-lat, dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;

    if(!best||d<best.d) best={d,A,B,px,py,dx,dy};
  }
  return best;
}
function facingFor(spot, ways){
  // Which way the beach faces (compass bearing toward the water), from the nearest shoreline within SHORE_MI.
  // OSM coastline ways run with land on the left and water on the right, so the water is on the segment's right-hand side.
  // natural=water ways (lakes, rivers) have no fixed direction: the water is on whichever side the polygon's centre lies.
  let best=null;
  for(const w of ways){
    const g=w.geometry; if(!g||g.length<2) continue;
    const seg=nearestSeg(spot.lat,spot.lon,g); if(!seg) continue;
    const dMi=seg.d*69.1; if(dMi>SHORE_MI) continue;
    const coast=w.tags&&w.tags.natural==="coastline";
    const segBearing=(Math.atan2(seg.dx,seg.dy)*180/Math.PI+360)%360;
    let f=(segBearing+90)%360;
    if(!coast){
      const kx=Math.cos(spot.lat*Math.PI/180); let cx=0,cy=0; g.forEach(p=>{cx+=(p.lon-spot.lon)*kx; cy+=p.lat-spot.lat;}); cx/=g.length; cy/=g.length;
      const cross=seg.dx*(cy-seg.py)-seg.dy*(cx-seg.px);   // >0: centre is to the left of the segment
      if(cross>0) f=(f+180)%360;
    }
    const rank=dMi+(coast?0:0.3);   // the sea coast wins over a pond at the same distance
    if(!best||rank<best.rank) best={facing:Math.round(f)%360, source:coast?"coastline":"water", mi:+dMi.toFixed(2), rank};
  }
  return best;
}
function applyFacing(spots, json){
  const ways=((json&&json.elements)||[]).filter(w=>w.type==="way"&&w.geometry);
  let n=0;
  for(const s of spots){ const f=facingFor(s,ways); if(f){ s.facing=f.facing; s.facingSrc=f.source; s.dir=sectorsFromFacing(f.facing); s.waves=f.source==="coastline"; n++; } }
  return n;
}
function applyCams(spots, json){
  // Public webcams OSM knows about (man_made=surveillance + surveillance:type=webcam with a link): nearest within CAM_MI per spot.
  const cams=((json&&json.elements)||[]).map(e=>{ const t=e.tags||{}; const url=t["contact:webcam"]||t.website||t.url||t["contact:website"]; return url&&e.lat!=null? {name:t.name||t.description||"Webcam",url,lat:e.lat,lon:e.lon}:null; }).filter(Boolean);
  let n=0;
  for(const s of spots){ let b=null; for(const c of cams){ const mi=haversineMi(s.lat,s.lon,c.lat,c.lon); if(mi<=CAM_MI&&(!b||mi<b.mi)) b={name:c.name,url:c.url,mi:+mi.toFixed(1)}; } if(b){ s.cam=b; n++; } }

}
// Photo relevance. Commons geosearch returns whatever was photographed near the coordinates: a flowerbed, the church, a road sign.
// Each candidate is scored by the words in its title and (non-hidden) categories: +1 per word built on a positive keyword
// (beach, beaches, coastline, kitesurfing, seaside, waterfront…), -1 per word built on a negative one (flowers, birds, buildings, maps…).
// A word counts once. Three-letter keywords (sea, bay, car, map) only count whole, plural or in a listed compound, so "season",
// "Carmel" and "maple" don't; longer ones also count inside a compound (windsurfing, offshore, breakwater, seabird).
const PHOTO_POS=["beach","coast","shore","ocean","sea","bay","surf","kite","dune","jetty","pier","playa","lake","water"];
const PHOTO_NEG=["flower","plant","insect","bird","sign","plate","car","vehicle","building","church","interior","map","logo","statue","person"];
const PHOTO_SUFFIX=/^(s|es|r|rs|ing|er|ers|al|line|lines|side|sides|shore|shores|front|fronts|scape|scapes|wall|walls|water|ocean|surf|surfing|surfer|surfers|board|boarding|boarder|boarders)?$/;
function photoWordHits(w,k){
  if(w.startsWith(k)) return PHOTO_SUFFIX.test(w.slice(k.length));                                  // beaches, coastline, kitesurfing, seaside, bayocean; not "season", "surface", "plateau"
  if(k.endsWith("y")&&w===k.slice(0,-1)+"ies") return true;                                          // jetties
  const i=(k.length>=5||k==="surf"||k==="bird")? w.indexOf(k,1):-1;                                  // windsurfing, offshore, breakwater, seabird; never "research", "Carmel", "maple", "design"
  return i>0 && PHOTO_SUFFIX.test(w.slice(i+k.length));
}
function photoKeywordScore(text){
  let s=0;
  for(const w of String(text).toLowerCase().split(/[^a-z]+/)){ if(!w) continue; if(PHOTO_POS.some(k=>photoWordHits(w,k))) s++; else if(PHOTO_NEG.some(k=>photoWordHits(w,k))) s--; }
  return s;
}
function pickCommonsPhoto(json){
  // Best photo for a spot tile from a Commons geosearch answer (up to 20 candidates within 1.5 km, categories included):
  // CC/public-domain JPEG, PNG or WebP, landscape; ranked by keyword score, then the aspect nearest the 3:2 tile, then size.
  // Nothing with a positive score -> null, and the tile keeps its neutral glyph: a blank beats a photo of the wrong thing.
  const pages=Object.values((json&&json.query&&json.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0));
  let best=null;
  for(const p of pages){
    const ii=p.imageinfo&&p.imageinfo[0]; if(!ii||!ii.thumburl||!(ii.width>ii.height)) continue;
    if(!/\.(jpe?g|png|webp)$/i.test(p.title||"")) continue;
    const m=ii.extmetadata||{}; const lic=(m.LicenseShortName&&m.LicenseShortName.value)||""; if(!/^(CC|Public domain|PD)/i.test(lic)) continue;
    const title=String(p.title).replace(/^File:/,"");
    const cats=(p.categories||[]).map(c=>String(c.title||"").replace(/^Category:/,""));
    const kw=photoKeywordScore([title,...cats].join(" "));
    if(kw<=0) continue;
    const rank=kw*10 + Math.max(0,2-Math.abs(ii.width/ii.height-1.5)*2) + Math.min(1,(ii.width*ii.height)/2.7e6);   // keywords decide; a panorama or a square loses the tie to a 3:2 frame; then the bigger original
    if(best&&rank<=best.rank) continue;
    const artist=((m.Artist&&m.Artist.value)||"").replace(/<[^>]+>/g,"").trim();
    best={rank, photo:{url:ii.thumburl, credit:`${title}: ${artist||"unknown"} (${lic})`, page:ii.descriptionurl||""}};
  }
  return best? best.photo: null;
}
/* page glue: network, state, rendering */
let awayFilePromise=null;
function awayFileCached(){ try{ const c=JSON.parse(localStorage.getItem("goc.awayspots")||"null"); if(c&&c.at&&Array.isArray(c.spots)&&Date.now()-Date.parse(c.at)<AWAY_CACHE_DAYS*864e5) return c; }catch(e){} return null; }

async function awayFile(fresh){
  // The precomputed catalogue: from localStorage if fetched within AWAY_CACHE_DAYS, else fetched once per page load.
  // A missing file (404) or an empty one resolves to no spots; a network failure throws so the banner can say so.
  if(!fresh){ const c=awayFileCached(); if(c) return c; if(awayFilePromise) return awayFilePromise; }
  awayFilePromise=(async()=>{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),30000);
    try{
      const r=await fetch(AWAY_FILE+"?v="+new Date().toISOString().slice(0,10),{signal:c.signal,cache:fresh?"reload":"default"});
      if(r.status===404) return {spots:[],missing:true};
      if(!r.ok) throw new Error("spot list "+r.status);
      const f=await r.json(); const file={generatedAt:f&&f.generatedAt||null, spots:(f&&Array.isArray(f.spots))?f.spots:[]};
      if(file.spots.length) awayFileStore(file);
      return file;
    } finally{ clearTimeout(t); }
  })();
  awayFilePromise.catch(()=>{ awayFilePromise=null; });   // a failure is retried on the next search
  return awayFilePromise;
}
async function overpass(query){
  // Background enrichment only (shoreline facing, webcams). ENRICH_MS covers every mirror together; the caller never waits on it.
  const deadline=Date.now()+ENRICH_MS; let err;
  for(const u of OVERPASS){
    const left=deadline-Date.now(); if(left<2000) break;
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),left);
    try{ const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(query),signal:c.signal,headers:{"Content-Type":"application/x-www-form-urlencoded"}}); if(!r.ok) throw new Error("OpenStreetMap said "+r.status); return await r.json(); }
    catch(e){ err=e; } finally{ clearTimeout(t); }

}
async function commonsPhoto(lat,lon){
  const u=`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${lat}|${lon}&ggsradius=1500&ggsnamespace=6&ggslimit=20&prop=imageinfo|categories&clshow=!hidden&cllimit=200&iiprop=url|size|extmetadata&iiurlwidth=640&iiextmetadatafilter=Artist|LicenseShortName`;
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),15000);
  try{ const r=await fetch(u,{signal:c.signal,headers:{"Api-User-Agent":"CoastalKiteboarding/1.0 (https://mikestoneapps.github.io/coastal-kiteboarding/)"}}); if(!r.ok) throw new Error(r.status); return pickCommonsPhoto(await r.json()); } finally{ clearTimeout(t); }
}
async function geocode(q){
  // Nominatim (OpenStreetMap): a town or a beach by name -> up to 5 places. Free; the browser's Referer identifies the app.
  const j=await fetchJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=${encodeURIComponent(q)}`,15000);
  return (Array.isArray(j)?j:[]).map(p=>({name:String(p.display_name||"").split(",").slice(0,2).map(s=>s.trim()).join(", "), full:p.display_name, lat:+(+p.lat).toFixed(4), lon:+(+p.lon).toFixed(4)})).filter(p=>!isNaN(p.lat)&&!isNaN(p.lon));
}
function cacheMerge(patch){ try{ const c=JSON.parse(localStorage.getItem("goc.cache")||"{}"); Object.assign(c,patch); localStorage.setItem("goc.cache",JSON.stringify(c)); }catch(e){} }
function awayCacheGet(key){ try{ const c=JSON.parse(localStorage.getItem("goc.cache")||"{}"); const a=c.away&&c.away[key]; if(a&&a.at&&Date.now()-Date.parse(a.at)<AWAY_CACHE_DAYS*864e5) return a; }catch(e){} return null; }

let awayTimer=null;
function maybeDiscover(){
  // Called at the top of render(): starts a search for a new area, re-searches when the drive radius outgrows the last one.
  if(!awayMode()) return;
  const key=awayKey(), mi=searchMiles();
  if(away.key===key){ if(away.status==="searching"||away.status==="scoring"||away.status==="idle") return; if(away.radiusMi>=mi) return; }
  else { const c=awayCacheGet(key); if(c&&c.radiusMi>=mi){ away={key,status:c.status==="empty"?"empty":"done",spots:c.spots||[],at:c.at,radiusMi:c.radiusMi,note:"cached",generatedAt:c.generatedAt||null}; ensureAwayForecasts(); return; } away={key,status:"idle",spots:[],at:null,radiusMi:0,note:""}; }

async function ensureAwayForecasts(){

  const key=away.key;
  try{ const {docs}=await fetchForecasts(missing); if(away.key!==key) return; mergeForecasts(docs); render(); }
  catch(e){ console.warn("away forecast",e); if(away.key===key){ away.note="noforecast"; render(); } }
}
async function discover(key, mi, fresh){
  const c=settings.custom, lat=c.lat, lon=c.lon;
  const keepOld= away.key===key? away.spots: [];   // a wider search for the same place keeps the rows up until the new ones land
  away={key, status:"searching", spots:keepOld, at:new Date().toISOString(), radiusMi:mi, note:""};
  render();
  let found, file;
  try{ file=await awayFile(fresh); found=pickAway(file, lat, lon, mi); }
  catch(e){ console.warn("away catalogue",e); if(away.key!==key||away.status!=="searching") return; away.status="error"; away.note=String(e&&e.message||e); render(); return; }
  if(away.key!==key||away.status!=="searching") return;   // he moved on

  if(!found.length){ away.spots=[]; away.status="empty"; awayCacheSet(); render(); return; }
  const byOsm={}; keepOld.forEach(s=>byOsm[s.osm]=s);

const keptLooking=new Set();   // kept-spot ids with a Commons lookup in flight
function enrichKept(spots){
  // Spots added at home get the same background Wikimedia Commons lookup as discovered ones: the scored picker, three at a

  const queue=(spots||settings.kept||[]).filter(s=>s.lat!=null&&s.lon!=null&&!s.photoUrl&&!s.photoChecked&&!keptLooking.has(s.id));
  queue.forEach(s=>keptLooking.add(s.id));

async function enrichAway(key){

function photoSrc(spot){

  if(away.status==="searching") t=`Looking for kite spots within ${mi} mi of ${here}…`;
  else if(away.status==="scoring") t=`${n} spot${n===1?"":"s"} near ${here}. Scoring…`;
  else if(away.status==="empty") t=`<b>No spots found here yet.</b> OpenStreetMap has no kitesurfing or windsurfing launches and no named beaches within ${mi} mi of ${here}${when}. Add one by hand: name, coordinates and which way the beach faces are all it needs.<div class="actions">${hand}${again}</div>`;
  else if(away.status==="error") t=`<b>Couldn't load the spot list</b> (${esc(away.note||"no answer")}), so there's nothing for ${here} yet. Try again, or add a spot by hand.<div class="actions">${again}${hand}</div>`;
  else if(away.status==="done") t=`${n} spot${n===1?"":"s"} within ${mi} mi of ${here}, from OpenStreetMap${away.note==="cached"?" (last search)":when}. Direction rules marked <b>auto</b> are inferred from the shoreline. Open a row and tap <b>Keep this spot</b> to save it${syncState.key?" to every linked device":""}.${away.note==="noforecast"?" <b>Couldn't get a forecast for them</b>; tap Refresh now.":""}<div class="actions">${again}${hand}</div>`;
  else t=`More than ${AWAY_MI} miles from both houses.`;
  return `<div class="away" id="away"><div class="lbl">Away from home</div><div>${t}</div></div>`;
}
function bindAway(){
  const a=document.getElementById("awayAgain"); if(a) a.onclick=()=>{ if(!awayMode()) return; try{ const c=JSON.parse(localStorage.getItem("goc.cache")||"{}"); if(c.away) delete c.away[awayKey()]; localStorage.setItem("goc.cache",JSON.stringify(c)); }catch(e){} discover(awayKey(), searchMiles(), true); };

}
function keepDiscovered(id){
  const s=away.spots.find(x=>x.id===id); if(!s) return;

/* ---------- settings sync (Cloudflare Worker, see sync/ and docs/SETUP-SYNC.md) ---------- */
// Optional. With no Worker URL the page behaves exactly as before: localStorage only.
// Set SYNC_URL once the Worker is deployed, or paste the URL in the Rider sheet (it travels in the device link).
const SYNC_URL="";
let syncState={url:SYNC_URL, key:null, remoteUpdatedAt:null, status:"", lastPull:0};
let photoResync=false;   // set by a device link below: the photos on this device must be re-uploaded under the new key
try{ const s=JSON.parse(localStorage.getItem("goc.sync")||"null"); if(s&&s.key){ syncState={...syncState,...s}; } }catch(e){}
function syncSave(){ try{ localStorage.setItem("goc.sync",JSON.stringify({url:syncState.url,key:syncState.key,remoteUpdatedAt:syncState.remoteUpdatedAt})); }catch(e){} }
function syncOn(){ return !!(syncState.key && syncState.url); }
function syncNewKey(){ const b=new Uint8Array(32); crypto.getRandomValues(b); return btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function syncLink(){ return location.origin+location.pathname+"#sync="+syncState.key+"&url="+encodeURIComponent(syncState.url); }
function syncSetStatus(t){ syncState.status=t; const el=document.getElementById("syncStatus"); if(el) el.textContent=t; }
async function syncFetch(method, body, path="/v1/settings"){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),15000);
  try{ const r=await fetch(syncState.url.replace(/\/+$/,"")+path,{method,signal:c.signal,headers:{Authorization:"Bearer "+syncState.key,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    let d=null; try{ d=await r.json(); }catch(e){} return {status:r.status,data:d}; } finally{ clearTimeout(t); }
}
function applyRemote(doc){
  // Server copy wins only when it is newer; defaults are re-merged exactly as on page load.
  const s=doc.settings||{};
  settings={...settings,...s, weights:{...DEFAULT_WEIGHTS,...(s.weights||{})}, comfort:{...DEFAULT_COMFORT,...(s.comfort||{})}, alerts:{...DEFAULT_ALERTS,...(s.alerts||{})}, overrides:s.overrides||{}, kept:Array.isArray(s.kept)?s.kept:[], photos:(s.photos&&typeof s.photos==="object")?s.photos:(settings.photos||{}), check:s.check||settings.check, updatedAt:doc.updatedAt};
  refreshKeptDrives(); syncState.remoteUpdatedAt=doc.updatedAt; saveLocal(); syncSave();
  ensureKeptForecasts();
}
async function ensureKeptForecasts(){
  // Kept spots that arrived from another device have no forecast here yet: pull theirs now rather than at the next full refresh.
  // Waits out a refresh already in flight, since ingest() replaces the forecast set.
  for(let i=0;i<120&&refreshing;i++) await new Promise(r=>setTimeout(r,500));
  const missing=settings.kept.filter(s=>!forecasts[s.id]&&s.lat!=null&&s.lon!=null); if(!missing.length) return;
  try{ const {docs}=await fetchForecasts(missing); mergeForecasts(docs); render(); }catch(e){ console.warn("kept forecast",e); }
}
async function syncPush(){
  if(!syncOn()) return;
  try{
    const r=await syncFetch("PUT",{settings, updatedAt:settings.updatedAt||new Date().toISOString(), base:syncState.remoteUpdatedAt});
    if(r.status===200){ syncState.remoteUpdatedAt=r.data.updatedAt; syncSave(); syncSetStatus("Synced "+new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})); photoSync(); return; }
    if(r.status===409 && r.data){
      // Another device wrote first. Newer timestamp wins; if that is us, push again on top of theirs.
      if(!settings.updatedAt || r.data.updatedAt>settings.updatedAt){ applyRemote(r.data); render(); syncSetStatus("Settings updated from another device"); photoSync(); }
      else { syncState.remoteUpdatedAt=r.data.updatedAt; syncSave(); return syncPush(); }
      return;
    }
    syncSetStatus("Sync failed ("+r.status+"); keeping this device's copy");
  }catch(e){ syncSetStatus("Offline — will sync when back online"); }
}
let syncTimer=null;
function syncSchedulePush(){ if(!syncOn()) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncPush,1500); }
async function syncPull(){
  if(!syncOn()) return; syncState.lastPull=Date.now();
  try{
    const r=await syncFetch("GET");
    if(r.status===404){ await syncPush(); return; }                      // first device: migrate the local copy up
    if(r.status!==200||!r.data){ syncSetStatus("Sync failed ("+r.status+")"); return; }
    if(!settings.updatedAt || r.data.updatedAt>settings.updatedAt){ applyRemote(r.data); render(); syncSetStatus("Synced "+new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})); photoSync(); }
    else if(r.data.updatedAt<settings.updatedAt){ syncState.remoteUpdatedAt=r.data.updatedAt; await syncPush(); }
    else { syncState.remoteUpdatedAt=r.data.updatedAt; syncSave(); syncSetStatus("Synced"); photoSync(); }
  }catch(e){ syncSetStatus("Offline — showing this device's settings"); }
}
function syncSection(){
  const inp='style="font:500 14px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);width:100%;max-width:420px;box-sizing:border-box"';
  if(!syncOn()) return `<p style="color:var(--muted);font-size:13px;margin:0 0 6px">Off. Your profile, limits, checklist edits, alert settings and kept spots live on this device only. Turning it on needs the sync service from <b>docs/SETUP-SYNC.md</b> (a free Cloudflare Worker); paste its address here once.</p>
    <div class="field"><label for="syncUrl">Sync service address</label><input type="url" id="syncUrl" value="${esc(syncState.url||"")}" placeholder="https://coastal-kiteboarding-sync.<you>.workers.dev" ${inp}></div>
    <div class="actions"><button class="btn primary" id="syncOn">Turn on sync</button></div><p id="syncStatus" style="color:var(--muted);font-size:13px;margin:6px 0 0">${esc(syncState.status||"")}</p>`;
  return `<p style="color:var(--muted);font-size:13px;margin:0 0 6px">On. Changes save here first and copy to the sync service a moment later; other linked devices pick them up when opened.</p>
    <div class="actions"><button class="btn primary" id="syncLink">Link another device</button><button class="btn" id="syncPull">Pull now</button><button class="btn" id="syncOff">Unlink this device</button></div>
    <div id="syncLinkBox" hidden style="margin-top:8px"><p style="font-size:13px;margin:0 0 4px">Open this link on the other device (text or AirDrop it to yourself). Anyone with it can read and change your settings, so don't post it.</p><input type="text" id="syncLinkText" readonly ${inp}><div class="actions" style="margin-top:6px"><button class="btn" id="syncCopy">Copy link</button>${navigator.share?'<button class="btn" id="syncShare">Share…</button>':""}</div></div>
    <p id="syncStatus" style="color:var(--muted);font-size:13px;margin:6px 0 0">${esc(syncState.status||"")}</p>`;
}
function bindSync(){
  const on=document.getElementById("syncOn"); if(on) on.onclick=()=>{ const u=(document.getElementById("syncUrl").value||"").trim().replace(/\/+$/,""); if(!/^https?:\/\//.test(u)){ document.getElementById("syncUrl").focus(); return; }
    syncState.url=u; syncState.key=syncNewKey(); syncState.remoteUpdatedAt=null; syncSave(); photoMarkUnsynced(); if(!settings.updatedAt) settings.updatedAt=new Date().toISOString(); saveLocal(); syncSetStatus("Connecting…"); syncPull().then(()=>{ document.getElementById("syncBox").innerHTML=syncSection(); bindSync(); }); };
  const lk=document.getElementById("syncLink"); if(lk) lk.onclick=()=>{ const b=document.getElementById("syncLinkBox"); b.hidden=!b.hidden; document.getElementById("syncLinkText").value=syncLink(); };
  const cp=document.getElementById("syncCopy"); if(cp) cp.onclick=()=>{ const t=document.getElementById("syncLinkText"); t.select(); const done=()=>{cp.textContent="Copied"; setTimeout(()=>cp.textContent="Copy link",2000);}; try{ navigator.clipboard.writeText(t.value).then(done).catch(()=>{ try{document.execCommand("copy")}catch(_){} done(); }); }catch(_){ done(); } };
  const sh=document.getElementById("syncShare"); if(sh) sh.onclick=()=>{ navigator.share({title:"Bistué Boarding sync link",text:"Open this on the other device to link it:",url:syncLink()}).catch(()=>{}); };
  const pl=document.getElementById("syncPull"); if(pl) pl.onclick=()=>{ syncSetStatus("Pulling…"); syncPull(); };
  const off=document.getElementById("syncOff"); if(off) off.onclick=async()=>{ await pushDisable(true); syncState={...syncState,key:null,remoteUpdatedAt:null,status:""}; try{localStorage.removeItem("goc.sync")}catch(e){} photoMarkUnsynced(); document.getElementById("syncBox").innerHTML=syncSection(); bindSync(); render(); };
}
(function syncFromHash(){
  // A device link: #sync=<key>&url=<worker>. Store it, drop it from the address bar, pull.
  const m=location.hash.match(/^#sync=([A-Za-z0-9_\-]{32,})(?:&url=([^&]+))?/); if(!m) return;
  syncState.key=m[1]; if(m[2]) syncState.url=decodeURIComponent(m[2]); syncState.remoteUpdatedAt=null; syncSave(); photoResync=true;
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
  syncState.status="Linked — pulling your settings…";
})();

/* ---------- rider photos (his own photo per spot, curated or added) ---------- */
// "Use my photo" in a spot's detail (and "Add a photo" in the add-spot sheet, which saves it with the new spot) opens the
// phone's camera or photo picker; the picture is resized here to the tile's 480×320 JPEG (about 40 KB) and kept in
// IndexedDB keyed by spot id, so it survives the forecast cache and never reloads from the network. With sync on it is also uploaded to the Worker (PUT /v1/photo/<spotId>, same sync-key auth), and the
// settings document lists which spots have one (settings.photos: spotId -> taken at), so other linked devices fetch the ones
// they lack in the background. "Remove photo" drops it everywhere and the tile goes back to the built-in or Commons photo.
const PHOTO_W=480, PHOTO_H=320, PHOTO_TARGET=48*1024, PHOTO_MAX=100*1024;   // the Worker refuses anything over PHOTO_MAX
var riderPhotos={};            // spotId -> {url (object URL), updatedAt, synced}
let photoTarget=null, photoSyncing=false, photoSyncAgain=false, photosReady=null;   // photoTarget: spot id, or a function given the picked File (the add-spot sheet); photosReady: the IndexedDB load, awaited before any sync
function photoDB(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open("goc.photos",1); }catch(e){ return rej(e); } r.onupgradeneeded=()=>{ r.result.createObjectStore("photos"); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("IndexedDB")); r.onblocked=()=>rej(new Error("IndexedDB blocked")); }); }
async function photoStore(mode, fn){
  // One transaction on the "photos" store; resolves with the request's result (or whatever fn returned) once it commits.
  const db=await photoDB();
  try{ return await new Promise((res,rej)=>{ const tx=db.transaction("photos",mode); const out=fn(tx.objectStore("photos")); tx.oncomplete=()=>res(out&&typeof out==="object"&&"result" in out&&!Array.isArray(out)? out.result: out); tx.onerror=()=>rej(tx.error||new Error("IndexedDB")); tx.onabort=()=>rej(tx.error||new Error("IndexedDB aborted")); }); }
  finally{ db.close(); }
}
function photoShow(id, blob, updatedAt, synced){ const old=riderPhotos[id]; if(old) try{ URL.revokeObjectURL(old.url); }catch(e){} riderPhotos[id]={url:URL.createObjectURL(blob),updatedAt,synced}; }
function photoDrop(id){ const old=riderPhotos[id]; if(old) try{ URL.revokeObjectURL(old.url); }catch(e){} delete riderPhotos[id]; }
function loadRiderPhotos(){ return photosReady=loadRiderPhotosNow(); }
async function loadRiderPhotosNow(){
  try{
    const rows=await photoStore("readonly",st=>{ const rows=[]; const rq=st.openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ rows.push({id:c.key,...c.value}); c.continue(); } }; return rows; });
    for(const r of rows){ if(r.blob) photoShow(r.id,r.blob,r.updatedAt,photoResync?false:!!r.synced); }
    if(photoResync){ photoResync=false; photoMarkUnsynced(); }
    if(rows.length&&dayKeys.length) render();
  }catch(e){ console.warn("photos unavailable",e); }
  photoSync();
}
async function decodePhoto(file){
  if(window.createImageBitmap){ try{ return await createImageBitmap(file,{imageOrientation:"from-image"}); }catch(e){} }
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("can't decode")); }; im.src=u; });
}
async function shrinkPhoto(file){
  // Centre-crop to the tile's 3:2, 480×320, JPEG; the quality steps down until it is about 40 KB.
  const im=await decodePhoto(file); const w=im.naturalWidth||im.width, h=im.naturalHeight||im.height; if(!w||!h) throw new Error("empty image");
  const c=document.createElement("canvas"); c.width=PHOTO_W; c.height=PHOTO_H; const g=c.getContext("2d");
  const sc=Math.max(PHOTO_W/w,PHOTO_H/h), dw=w*sc, dh=h*sc; g.drawImage(im,(PHOTO_W-dw)/2,(PHOTO_H-dh)/2,dw,dh); if(im.close) im.close();
  let blob=null;
  for(const q of [0.82,0.72,0.62,0.52,0.42]){ blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); if(!blob) throw new Error("no JPEG"); if(blob.size<=PHOTO_TARGET) break; }
  if(blob.size>PHOTO_MAX) throw new Error("photo too large");
  return blob;
}
function pickRiderPhoto(target){ const inp=document.getElementById("photoFile"); if(!inp) return; photoTarget=target; inp.value=""; inp.click(); }   // target: spot id, or a callback for the File
function photoNote(id,t){ const b=document.querySelector(`[data-photo="${CSS.escape(id)}"]`); if(b) b.textContent=t; }
document.getElementById("photoFile").onchange=async()=>{
  const inp=document.getElementById("photoFile"); const f=inp.files&&inp.files[0], id=photoTarget; photoTarget=null; if(!f||!id) return;
  if(typeof id==="function"){ id(f); return; }
  photoNote(id,"Saving photo…");
  try{ await setRiderPhoto(id,f); }catch(e){ console.warn("photo",e); photoNote(id,"Couldn't use that photo"); setTimeout(()=>photoNote(id,"Use my photo"),3000); }
};
async function setRiderPhoto(id, file){ await saveRiderPhoto(id, await shrinkPhoto(file)); render(); }
async function saveRiderPhoto(id, blob){
  // A shrunk JPEG for spot id: IndexedDB first, then shown, listed in settings.photos and uploaded when sync is on.
  const updatedAt=new Date().toISOString();
  await photoStore("readwrite",st=>st.put({blob,updatedAt,synced:false},id));
  photoShow(id,blob,updatedAt,false);
  settings.photos=settings.photos||{}; settings.photos[id]=updatedAt; saveSettings();
  photoSync();
}
async function removeRiderPhoto(id){
  photoDrop(id); if(settings.photos) delete settings.photos[id]; saveSettings(); render();
  try{ await photoStore("readwrite",st=>st.delete(id)); }catch(e){}
  if(syncOn()){ try{ const r=await photoFetch("DELETE",id); if(!r.ok) throw new Error(r.status); }catch(e){ photoPendingDelete(id,true); } }
}
function photoPendingDelete(id, add){ try{ const l=JSON.parse(localStorage.getItem("goc.photos.rm")||"[]").filter(x=>x!==id); if(add) l.push(id); localStorage.setItem("goc.photos.rm",JSON.stringify(l)); }catch(e){} }
function photoMarkUnsynced(){
  // A new sync key (turned on, linked, or unlinked): whatever is here has to reach that rider's store again.
  for(const p of Object.values(riderPhotos)) p.synced=false;
  photoStore("readwrite",st=>{ const rq=st.openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ c.update({...c.value,synced:false}); c.continue(); } }; }).catch(()=>{});
}
async function photoFetch(method, id, blob){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),20000);
  try{ return await fetch(syncState.url.replace(/\/+$/,"")+"/v1/photo/"+encodeURIComponent(id),{method,signal:c.signal,headers:{Authorization:"Bearer "+syncState.key,...(blob?{"Content-Type":"image/jpeg"}:{})},body:blob||undefined}); } finally{ clearTimeout(t); }
}
async function photoSync(){
  // Background, after every successful settings sync: upload what was taken here, fetch what another device added,
  // drop what was removed elsewhere. Scores and tiles never wait for it; a tile is patched in place when its photo lands.
  if(!syncOn()) return;
  if(photoSyncing){ photoSyncAgain=true; return; }
  photoSyncing=true; await photosReady;
  try{
    do{
      photoSyncAgain=false;
      const want=settings.photos||{}; let changed=false;
      let rm=[]; try{ rm=JSON.parse(localStorage.getItem("goc.photos.rm")||"[]"); }catch(e){}
      for(const id of rm){ try{ const r=await photoFetch("DELETE",id); if(r.ok) photoPendingDelete(id,false); }catch(e){} }   // removals that didn't reach the service
      for(const [id,p] of Object.entries(riderPhotos)){ if(p.synced) continue;
        const rec=await photoStore("readonly",st=>st.get(id)); if(!rec||!rec.blob) continue;
        try{ const r=await photoFetch("PUT",id,rec.blob); if(!r.ok) continue; }catch(e){ continue; }
        await photoStore("readwrite",st=>st.put({...rec,synced:true},id)); p.synced=true;
        if(!want[id]||want[id]<rec.updatedAt){ want[id]=rec.updatedAt; settings.photos=want; saveSettings(); } }
      for(const [id,at] of Object.entries(want)){ const p=riderPhotos[id]; if(p&&(!p.synced||p.updatedAt>=at)) continue;
        try{ const r=await photoFetch("GET",id); if(!r.ok) continue; const blob=await r.blob(); if(!blob.size) continue;
          await photoStore("readwrite",st=>st.put({blob,updatedAt:at,synced:true},id)); photoShow(id,blob,at,true); changed=true;
          const spot=allSpots().find(s=>s.id===id); if(spot) patchPhoto(spot); }catch(e){} }
      for(const id of Object.keys(riderPhotos)){ if(want[id]||!riderPhotos[id].synced) continue;
        try{ const r=await photoFetch("GET",id);
          if(r.status===404){ await photoStore("readwrite",st=>st.delete(id)); photoDrop(id); changed=true; const spot=allSpots().find(s=>s.id===id); if(spot) patchPhoto(spot); }   // removed on another device
          else if(r.ok){ want[id]=riderPhotos[id].updatedAt; settings.photos=want; saveSettings(); } }   // still on the service: the settings list just lost it in a merge
        catch(e){} }
      if(changed&&openSpot) render();   // the open detail's Remove photo button follows
    }while(photoSyncAgain);
  }catch(e){ console.warn("photo sync",e); }
  finally{ photoSyncing=false; }
}

/* ---------- data ---------- */
function ingest(docs, fetchedAt){
  forecasts={}; docs.forEach(d=>{ if(d&&d.spotId) forecasts[d.spotId]=d; });
  const first=Object.values(forecasts)[0];
  if(!first){ document.getElementById("sub").textContent="No forecast loaded yet."; document.getElementById("list").innerHTML=`<div class="empty">Forecast data hasn't been loaded into this page yet. Once it is, every spot within your drive radius shows up here, ranked.</div>`; return; }
  const today=new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"});
  dayKeys=[...new Set(first.time.map(t=>t.slice(0,10)))].filter(d=>d>=today);
  if(!dayKeys.length) dayKeys=[...new Set(first.time.map(t=>t.slice(0,10)))];
  if(pendingDay&&dayKeys.includes(pendingDay)){ selDay=pendingDay; pendingDay=null; }
  if(!selDay||!dayKeys.includes(selDay)) selDay=dayKeys[0];
  const fa=new Date(fetchedAt||first.fetchedAt);
  const ageMin=Math.round((Date.now()-fa.getTime())/60000);
  const age= ageMin<60? ageMin+" min ago" : ageMin<1440? Math.round(ageMin/60)+"h ago" : Math.round(ageMin/1440)+"d ago";
  document.getElementById("sub").textContent="Updated "+age+(ageMin>360?" (stale)":"")+" · knots · "+allSpots().length+" spots";
  render();
}

let lastFetchedAt=null, refreshing=false;
function setRefreshUI(state,msg){
  const b=document.getElementById("refreshBtn"); if(!b) return;
  b.hidden=false; b.disabled=state==="busy";
  b.textContent= state==="busy"? "Refreshing…" : "Refresh now";
  const n=document.getElementById("refreshNote"); if(n){ n.textContent=msg||""; n.hidden=!msg; }
}
const DAYS=5, TZ="America/Los_Angeles";
async function fetchJSON(url, ms=25000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); } finally{ clearTimeout(t); }
}
const rnd=(xs,nd=1)=>xs.map(v=>v==null?null:+v.toFixed(nd));
async function fetchForecasts(list){
  // One Open-Meteo call for all spots (multi-location), one marine call for the coast spots. `list` limits it (discovered spots).
  const all=list||allSpots();
  const lat=all.map(s=>s.lat).join(","), lon=all.map(s=>s.lon).join(",");
  const q=`latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,precipitation_probability,weather_code,visibility&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,weather_code&models=best_match,gfs_seamless,icon_seamless&wind_speed_unit=kn&temperature_unit=fahrenheit&forecast_days=${DAYS}&timezone=${encodeURIComponent(TZ)}`;
  const w=await fetchJSON("https://api.open-meteo.com/v1/forecast?"+q, 40000);
  const arr=Array.isArray(w)?w:[w];
  const now=new Date().toISOString().slice(0,19)+"+00:00";
  const docs={};
  all.forEach((s,i)=>{ const d=arr[i]; if(!d||!d.hourly) return; const h=d.hourly; const col=(n,m="best_match")=>h[`${n}_${m}`]||h[n]||new Array(h.time.length).fill(null); const cur=d.current||{}; const cv=n=>cur[`${n}_best_match`]??cur[n]??null;
    docs[s.id]={spotId:s.id,fetchedAt:now,time:h.time,spd:rnd(col("wind_speed_10m")),gst:rnd(col("wind_gusts_10m")),dir:rnd(col("wind_direction_10m"),0),temp:rnd(col("temperature_2m"),0),pop:rnd(col("precipitation_probability"),0),code:col("weather_code"),vis:rnd(col("visibility"),0),
      m:{gfs:{spd:rnd(col("wind_speed_10m","gfs_seamless")),gst:rnd(col("wind_gusts_10m","gfs_seamless")),dir:rnd(col("wind_direction_10m","gfs_seamless"),0)},icon:{spd:rnd(col("wind_speed_10m","icon_seamless")),gst:rnd(col("wind_gusts_10m","icon_seamless")),dir:rnd(col("wind_direction_10m","icon_seamless"),0)}},
      now:{time:cur.time,spd:cv("wind_speed_10m"),gst:cv("wind_gusts_10m"),dir:cv("wind_direction_10m"),temp:cv("temperature_2m"),code:cv("weather_code")}}; });
  const wave=all.filter(s=>s.waves);
  try{
    const mq=`latitude=${wave.map(s=>s.lat).join(",")}&longitude=${wave.map(s=>s.lon).join(",")}&hourly=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period&forecast_days=${DAYS}&timezone=${encodeURIComponent(TZ)}`;
    const m=await fetchJSON("https://marine-api.open-meteo.com/v1/marine?"+mq, 40000); const marr=Array.isArray(m)?m:[m];
    wave.forEach((s,i)=>{ const d=marr[i]; if(!d||!d.hourly||!docs[s.id]) return; const mh=d.hourly; Object.assign(docs[s.id],{wh:rnd(mh.wave_height,2),wp:rnd(mh.wave_period,1),wd:rnd(mh.wave_direction,0),sh:rnd(mh.swell_wave_height,2),sp:rnd(mh.swell_wave_period,1)}); });
  }catch(e){ console.warn("marine failed",e); }
  return {docs:Object.values(docs), fetchedAt:now};
}
async function fetchObsFile(){
  // obs.json is written hourly by .github/workflows/observations.yml (NWS stations + NDBC buoys, which have no CORS).
  // Same origin, so it works on GitHub Pages; readings carry their own timestamp and age honestly between runs.
  const d=await fetchJSON("obs.json?t="+Math.floor(Date.now()/300000), 15000);
  return d&&d.obs? d.obs : {};
}
function applyObs(o){
  obsData=mergeObs(obsData,o); render();
  cacheMerge({obs:obsData});
}
async function fetchStations(){
  // NWS/METAR observations, nearest two per spot, fetched directly in parallel so the page still has readings if the hourly job is late.
  const ids=[...new Set(Object.values(NWS_STATIONS).flat().map(x=>x.id))];
  const nowMs=Date.now(); const readings={};
  await Promise.all(ids.map(async id=>{ try{ const d=(await fetchJSON(`https://api.weather.gov/stations/${id}/observations/latest`,15000)).properties;
    const spd=d.windSpeed&&d.windSpeed.value, gst=d.windGust&&d.windGust.value, dir=d.windDirection&&d.windDirection.value;
    readings[id]={time:d.timestamp,spd:spd==null?null:+(spd/1.852).toFixed(1),gst:gst==null?null:+(gst/1.852).toFixed(1),dir,age_min:Math.round((nowMs-Date.parse(d.timestamp))/60000)}; }catch(e){} }));
  const out={}; for(const [sid,lst] of Object.entries(NWS_STATIONS)){ out[sid]=lst.filter(x=>readings[x.id]).map(x=>({id:x.id,name:x.name,kind:"nws",dist_mi:x.dist_mi,...readings[x.id]})); }
  return out;
}
async function refreshAll(manual){
  if(refreshing) return; refreshing=true; setRefreshUI("busy", manual?"Pulling the latest forecast…":"");
  try{
    const {docs,fetchedAt}=await fetchForecasts();
    lastFetchedAt=fetchedAt; ingest(docs,fetchedAt);
    cacheMerge({docs,fetchedAt,obs:obsData});
    setRefreshUI("idle", manual?"Forecast updated.":"");
    // Station readings never hold up the scores: both sources merge in as they arrive, fresher reading per station wins.
    fetchObsFile().then(applyObs).catch(e=>console.warn("obs.json unavailable",e));
    fetchStations().then(applyObs).catch(()=>{});
  }catch(e){
    console.warn(e); setRefreshUI("idle", Object.keys(forecasts).length? "Couldn't reach the forecast service; showing the last one." : "Couldn't reach the forecast service. Check your connection and tap Refresh.");
    if(!Object.keys(forecasts).length) ingest([]);
  }
  refreshing=false; if(manual) setTimeout(()=>setRefreshUI("idle",""),4000);
}
(function boot(){

  // re-fetch when the app comes back to the foreground after 30+ minutes
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return; if(lastFetchedAt && Date.now()-Date.parse(lastFetchedAt)>30*60000) refreshAll(false); if(syncOn() && Date.now()-syncState.lastPull>5*60000) syncPull(); });
})();
