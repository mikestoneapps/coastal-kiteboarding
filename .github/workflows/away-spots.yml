name: Away spots catalogue

# Weekly job behind the page's away-from-home mode. Asks Overpass (overpass-api.de, then other public mirrors)
# for every kitesurf/kiteboard/windsurf feature worldwide (one query) plus the named beaches of the US, Canada
# and Mexico coasts and Great Lakes (about 4°x4° tiles, 90 s each; a country-wide beach query timed out on every
# mirror), and commits the compact away-spots.json the page filters by drive radius.
# The browser never queries Overpass for the spot list any more (public mirrors took 30+ s or failed outright).
# The run is partial-tolerant: a tile that fails keeps the previous file's beaches for that area and is listed in
# the log; only a failed sport query exits non-zero and leaves the last good file in place.
on:
  schedule:
    - cron: "13 10 * * 1"   # Mondays 10:13 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: away-spots
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the catalogue from OpenStreetMap
        run: python3 away_spots.py away-spots.json

      - name: Commit away-spots.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add away-spots.json
          # away_spots.py leaves the file untouched when the spots didn't change, so the date alone never commits.
          if git diff --cached --quiet; then
            echo "away-spots.json unchanged"
            exit 0
          fi
          git commit -m "Update away-spots catalogue from OpenStreetMap"
          # Scheduled runs are on main; a manual run commits to the branch it was started from.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
