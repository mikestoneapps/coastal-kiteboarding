name: Deploy sync Worker

# Deploys sync/worker.js to Cloudflare when the repo has CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets (see docs/SETUP-SYNC.md). Without them the job skips, so this never fails a push.
on:
  push:
    branches: [main]
    paths: ["sync/**", ".github/workflows/sync-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare secrets
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No Cloudflare secrets; skipping deploy."; fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with: { node-version: "22" }
      - name: Test the Worker
        if: steps.creds.outputs.ok == 'true'
        run: node sync/test.mjs
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: sync
        run: npx --yes wrangler@4 deploy
