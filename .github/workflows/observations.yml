name: Station observations

# The hourly job. Two independent parts:
#   observations — fetch the latest NWS and NDBC readings for every spot into obs.json and commit it so
#                  the page can read buoys (no CORS) same-origin. Then accuracy.py writes one line per spot with a
#                  fresh reading to accuracy.jsonl: observed knots beside each forecast model's number for that hour
#                  (90-day window), committed with obs.json. Phase 5 turns it into per-spot, per-model bias.
#   alerts       — score every spot for every rider who enabled notifications (alerts/run.mjs, scoring.js)
#                  and send one push digest per rider. Skips itself until the three secrets exist
#                  (docs/SETUP-SYNC.md, "Push alerts"). Commits nothing.
# Hourly 05:00–21:00 Pacific on main; cron is UTC, so the window below covers both PDT (12–04 UTC) and
# PST (13–05 UTC) with one extra run at each edge.
on:
  schedule:
    - cron: "7 12-23,0-5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observations
  cancel-in-progress: false

jobs:
  observations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch observations
        run: python3 obs_standalone.py obs.json

      - name: Log forecast accuracy
        # Never fails the job (exits 0 on any error) so a forecast outage can't hold up obs.json.
        run: python3 accuracy.py obs.json accuracy.jsonl

      - name: Commit obs.json and accuracy.jsonl if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obs.json accuracy.jsonl
          if git diff --cached --quiet; then
            echo "obs.json and accuracy.jsonl unchanged"
            exit 0
          fi
          git commit -m "Update station observations"
          # Scheduled runs are on main; a manual run commits to the branch it was started from.
          # Another run or a merge may have landed meanwhile, so rebase once before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SYNC_URL: ${{ secrets.SYNC_URL }}
      SYNC_ADMIN_TOKEN: ${{ secrets.SYNC_ADMIN_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alerts/package-lock.json
      - name: Install web-push
        run: npm ci --prefix alerts --no-audit --no-fund
      - name: Check the rules against the page
        run: node alerts/test.mjs
      - name: Evaluate and send push alerts
        run: node alerts/run.mjs
